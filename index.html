<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:#f4ead5 radial-gradient(#1a1a1a1f 1.2px,transparent 1.5px) 0 0/14px 14px;color:#1a1a1a;font:700 16px Nunito,sans-serif;min-height:100vh}
#a{max-width:440px;margin:auto;padding:22px 18px 40px;text-align:center}
.L,h1,.big,.sc{font-family:'Lilita One',sans-serif;font-weight:400}

.k:nth-child(odd){transform:rotate(-1.4deg)}.k:nth-child(even){transform:rotate(1.3deg)}

.ci span{position:absolute;line-height:1;cursor:pointer;transform:translate(-50%,-50%);color:#1a1a1a;padding:2px}
.k:last-child:nth-child(odd){grid-column:1/-1;transform:rotate(-1deg)}.bad{animation:sh .3s}@keyframes fly{from{transform:translateY(150px) scale(1.6);opacity:.3}to{transform:none;opacity:1}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body><div id="a"></div><script>

let ws,off=0,room=null,n=1,wins={me:0,opp:0},view='home',msg='',last=null,want=0,cd=null,pend=null,cur='',on={me:'',opp:''},nm=localStorage.name||'',introG='',lk=0,closed=1,X={},

const aimG=()=>cur=='darts'||cur=='archery';

function startGame(g,at){if(cd)clearInterval(cd);cur=g;view='play';closed=1;X={};

 if(t=='sround'){closed=0;const r=rng(d.seed);if(c)c.textContent='';$('#gm').innerHTML='<div class="sc">Round '+d.k+'</div>'+ringH(d.A,r)+ringH(d.B,r);

 else if(t=='pplay'){X.k=d.k;X.it=[];X.cnt={};d.ty.forEach(y=>X.cnt[y]=0);closed=0;if(c)c.textContent='Build it!';

function play(g){if(!(room&&n>1)){msg='Tussle is a 2-player game, so invite a friend first!';view='home';ui();return}send({t:'pick',g})}
