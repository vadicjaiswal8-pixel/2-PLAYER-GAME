 ws.onmessage=e=>{const d=JSON.parse(e.data),t=d.t;
  if(t=='err'){msg=d.err;room=null;localStorage.removeItem('room');history.replaceState(null,'','/');if(view!='play'){view='home';ui()}}
  else if(t=='room'){room=d.code;n=d.n;wins=d.wins;on=d.names||on;on.bot=(on.opp||'').indexOf('(bot)')>=0;on.opp=(on.opp||'').replace(' (bot)','');localStorage.room=room;msg='';history.replaceState(null,'','/');if(view=='name')view='home';if(want&&n==1){want=0;share()}if(botG){const g=botG;botG='';send({t:'bot',g,lvl})}if(inviteFor&&n>1&&!isBot()){const g=inviteFor;inviteFor='';send({t:'pick',g})}if(view!='play')ui()}

 $('#a').innerHTML='<h2>'+G[g][0]+'</h2><div class="pill" id="op"></div><div class="big" id="cd"></div><div id="gm"></div>';sb();if(BG[g])$('#op').style.display='none';
 cd=setInterval(()=>{const l=at-Date.now();const e=$('#cd');if(l>0){const v=Math.ceil(l/1000);if(e.textContent!=v){snd('tick');e.textContent=v;e.classList.remove('cdp');void e.offsetWidth;e.classList.add('cdp')}return}clearInterval(cd);e.textContent='GO!';e.classList.remove('cdp');void e.offsetWidth;e.classList.add('cdp');snd('go')},100)}

const cpos=()=>{const t=(performance.now()-X.st)/1000,p=X.p;return[Math.round(Math.cos(t*p[0]+p[2])*100),Math.round(Math.sin(t*p[1]+p[3])*100)]};
function cloop(){if(!X.mine||X.sent)return;const[x,y]=cpos(),c=$('#ch');if(c){c.style.left=(117+x)+'px';c.style.top=(117+y)+'px'}X.raf=requestAnimationFrame(cloop)}
function pzr(){$('#pzm').innerHTML=pz(X.it);for(const t in X.cnt)$('#n_'+t).textContent=X.cnt[t]}
function duel(d){const t=d.t,c=$('#cd');
 if(t=='bs')bs(d);
 else if(t=='hstart'||t=='sstart'){X.ids=d.ids;X.me=d.ids.indexOf(pid);X.s=null;X.d=null;X.fall=null;closed=0;if(c)c.textContent='';if(!$('#cv'))cvInit(t=='hstart'?300:320,t=='hstart'?500:320)}
 else if(t=='hs'){X.s={pk:d.pk,pd:d.pd};if(!X.d)X.d=JSON.parse(JSON.stringify(X.s));if(d.ev)snd('hit')}
 else if(t=='ss'){X.s={b:d.b,ar:d.ar};if(!X.d)X.d=JSON.parse(JSON.stringify(X.s));if(d.ev){X.hit=Date.now();snd('hit');vib(25);const c=$('#cv');if(c){c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad')}}}
 else if(t=='sround'){closed=0;const r=rng(d.seed);if(c)c.textContent='';$('#gm').innerHTML='<div class="sc">Round '+d.k+'</div>'+ringH(d.A,r)+ringH(d.B,r);

 else if(t=='dwait'){X.k=d.k;closed=0;if(c)c.textContent='';$('#gm').innerHTML='<button id="rb" class="tap rd">WAIT…</button>';$('#rb').onpointerdown=()=>{if(!closed)send({t:'in',k:X.k})}}
 else if(t=='ddraw'){const b=$('#rb');if(b){b.textContent='DRAW!';b.className='tap gr'}}
 else if(t=='pshow'){closed=1;X.k=d.k;X.sl=null;if(X.tm)clearInterval(X.tm);const end=Date.now()+d.ms;$('#gm').innerHTML='<div class="rc"><div class="L" style="font-size:20px">THE RECIPE</div>'+pzSvg(d.slots,{w:250})+'</div>';
  X.tm=setInterval(()=>{const l=Math.ceil((end-Date.now())/1000),e=$('#cd');if(e)e.textContent=l>0?'Memorize! '+l:'';if(l<=0)clearInterval(X.tm)},200)}
 else if(t=='pplay'){X.k=d.k;X.sl=Array(d.n).fill(null);X.sel=null;X.hl=-1;closed=0;if(c)c.textContent='Build it!';
  $('#gm').innerHTML='<div class="opz"><div id="opz">'+pzSvg(Array(d.n).fill(null),{w:84,slots:1})+'</div><small id="opn" style="font-weight:900">'+on.opp+' 0/'+d.n+'</small></div><div id="pzm">'+pzSvg(X.sl,{slots:1,w:250,id:'psv'})+'</div><div class="tray">'+d.pal.map(y=>'<div class="tp" data-t="'+y+'"><svg viewBox="-20 -20 40 40" width="54" height="54">'+TP[y]+'</svg></div>').join('')+'</div><button class="b" id="un">CLEAR</button><button class="b" id="dn" style="background:#e5392f;color:#fff6e0;font-size:20px;opacity:.45">DONE!</button>';pzBind()}
 else if(t=='pprog'){const f=d.filled,e=$('#opz');if(e){e.innerHTML=pzSvg(f.map(v=>v?'x':null),{w:84,slots:1,ghost:1});$('#opn').textContent=on.opp+' '+f.filter(Boolean).length+'/'+f.length}}
 else if(t=='spoint'){closed=1;sb(d.pts);if(d.w&&!BG[cur])rexSay(d.w==pid?'mine':'his');if(cur=='sumo'&&d.w&&X.ids)X.fall={i:1-X.ids.indexOf(d.w),t:Date.now()};if(d.w){snd(d.w==pid?'point':'bad');vib(d.w==pid?40:[30,30,30])}const b=$('#rb');if(b)b.disabled=true;
  if(c)c.textContent=d.w==null?'Time up! No point':BG[cur]?(d.w==pid?'You win!':on.opp+' wins!'):cur=='draw'?(d.why=='early'?(d.by==pid?'Too early! Point to '+on.opp:on.opp+' jumped the gun!'):(d.w==pid?'You were faster! '+d.ms+' ms':on.opp+' was faster · '+d.ms+' ms')):(d.w==pid?'You got it!':on.opp+' got it!')}
 else if(t=='aturn'){if(d.i==0||!$('#bd'))aimInit();cancelAnimationFrame(X.raf);X.i=d.i;X.p=d.p;X.mine=d.who==pid;X.sent=0;X.st=performance.now();sb(d.pts);
  $('#st').textContent=X.mine?'YOUR TURN!':on.opp+(cur=='archery'?' is aiming…':' is throwing…');
  if(cur=='archery'){const w=$('#wd');w.style.display='';w.textContent='Wind '+(d.wind>0?'→ ':'← ')+Math.abs(d.wind)}
  $('#ch').style.display=X.mine?'':'none';$('#th').disabled=!X.mine;$('#wp').innerHTML=X.mine?(cur=='archery'?BOW:DTB):'';if(X.mine)cloop()}
 else if(t=='athrown'){snd(d.miss?'bad':cur=='archery'?'twang':'hit');vib(30);cancelAnimationFrame(X.raf);$('#ch').style.display='none';$('#wp').innerHTML='';$('#th').disabled=true;sb(d.pts);
  if(!d.miss){let m=cur=='archery'?AR:DT;if(d.who!=pid)m=m.replace(/#e5392f/g,OC());$('#bd').insertAdjacentHTML('beforeend','<div style="position:absolute;left:'+(120+d.hx)+'px;top:'+(129+d.hy)+'px;animation:fly .22s ease-out"><div style="transform:rotate('+Math.round(Math.random()*16-8)+'deg);transform-origin:10px 0;line-height:0">'+m+'</div></div>')}
  $('#st').textContent=(d.who==pid?'You':on.opp)+(d.miss?' missed!':' scored '+d.s+'!')}}
function openGame(g){selG=g;view='game';botOpen=0;howOpen=0;msg='';ui()}
function setLvl(i){lvl=i;localStorage.lvl=i;ui()}
function playBot(g){msg='';if(!room){botG=g;send({t:'create'});return}send({t:'bot',g,lvl})}
function playFriend(g){if(!nm.trim()){msg='Type your name on the home screen first!';ui();return}
 if(room&&n>1&&!isBot()){send({t:'pick',g});return}
 inviteFor=g;msg='Send the invite link to your friend. The game starts when they join!';if(!room){want=1;send({t:'create'})}else share();ui()}
function rematch(g){if(isBot())send({t:'bot',g,lvl});else send({t:'pick',g})}
function ready(){const b=$('#rbtn');send({t:'ready'});b.textContent='Waiting for '+(on.opp||'friend')+'…';b.disabled=true}
function home(){if(cd)clearInterval(cd);cancelAnimationFrame(X.raf);const m=$('#qm');if(m)m.remove();view='home';ui()}
function share(){const u=location.origin+'/?r='+room;
 if(navigator.share)navigator.share({title:'Tussle',text:(nm||'Your friend')+' challenged you on Tussle!',url:u}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(u).then(()=>{msg='Invite link copied! Send it to your friend.';ui()});else{msg=u;ui()}}
function invite(){if(!nm.trim()){msg='Type your name first!';ui();return}if(!room){want=1;send({t:'create'})}else share()}
function joinNow(){const v=$('#nin').value.trim();if(!v)return;nm=cn(v)||'Player';localStorage.name=nm;send({t:'join',code:pend})}

 if(view=='game'){const g=selG,H=G[g];
  a.innerHTML='<div class="ban" style="background-color:'+H[2]+'"><div style="transform:scale(1.5);height:120px;padding-top:20px">'+H[4]+'</div><div class="L" style="font-size:32px;color:#fff6e0;-webkit-text-stroke:2px #1a1a1a;text-shadow:3px 3px 0 #1a1a1a;margin-top:6px">'+H[0].toUpperCase()+'</div></div>'
  +(msg?'<div class="pill">'+msg+'</div>':'')
  +'<div class="pill" style="text-align:left;word-break:normal;font-size:17px;box-shadow:none">'+D[g]+(howOpen?'<hr><div style="font-size:15px">'+HOW[g]+'</div>':'')+'</div>'
  +'<button class="b" onclick="howOpen=!howOpen;ui()" style="background:#cbd5e1;font-size:15px;padding:8px 14px">'+(howOpen?'HIDE HOW TO PLAY':'HOW TO PLAY')+'</button>'
  +'<button class="b bl" onclick="playFriend(\''+g+'\')">PLAY VS FRIEND</button><button class="b bl" onclick="botOpen=!botOpen;ui()">PLAY VS BOT</button>'
  +(botOpen?'<div class="pill"><div class="L" style="font-size:18px;margin-bottom:6px">BOT DIFFICULTY</div>'+['EASY','MEDIUM','HARD'].map((n,i)=>'<button class="b" style="margin:3px;padding:6px 8px;display:inline-flex;flex-direction:column;align-items:center;background:'+(lvl==i?'#ffc93c':'#fff6e0')+'" onclick="setLvl('+i+')"><svg viewBox="-4 -16 108 148" width="52" height="72">'+rexSvg(i)+'</svg><span style="font-size:13px">'+n+'</span></button>').join('')+'<br><button class="b cta" style="margin-top:8px" onclick="playBot(\''+g+'\')">START!</button></div>':'')
  +'<button class="b" style="background:#e9967a" onclick="home()">Back</button>';return}
 if(view=='intro'){const g=introG;a.innerHTML='<h2>HOW TO PLAY</h2><div style="margin:8px auto;transform:scale(1.5);height:130px;padding-top:24px">'+G[g][4]+'</div><h2 style="font-size:34px">'+G[g][0]+'</h2><div class="pill" style="text-align:left;font-size:17px;word-break:normal">'+HOW[g]+'</div><button class="b cta" id="rbtn" onclick="ready()">I\'M READY!</button><button class="b" onclick="doQuit()">Back</button>';return}
 const o=on.opp||'Friend';
 if(view=='res'){const d=last,g=d.g,T={me:'YOU WIN!',opp:o.toUpperCase()+' WINS!',tie:"IT'S A TIE!",left:o.toUpperCase()+' LEFT'}[d.win];

 const link=room?location.origin+'/?r='+room:'';

 +'<div class="me"><span class="av" style="background:#e5392f">'+((nm||'?')[0]).toUpperCase()+'</span><input id="nin" maxlength="14" placeholder="Your name" value="'+nm.replace(/"/g,'')+'" oninput="nmIn(this.value)"></div><button class="b cta" onclick="invite()">'+(room?'SHARE INVITE LINK':'CHALLENGE A FRIEND')+'</button>'
 +SEC.map(s=>'<div class="sec"><i style="background:'+s[2]+'"></i>'+s[0]+'</div><div class="grid">'+s[1].map(cardH).join('')+'</div>').join('')
 +'<div class="board"><div class="L" style="font-size:19px">RIVALRY RECORD</div><div class="sbr"><span class="av" style="background:#e5392f">'+(nm||'Y')[0].toUpperCase()+'</span>'+wins.me+' – '+wins.opp+oppAv(38)+'</div><small style="font-weight:900">'+(nm||'You')+' vs '+o+'</small></div>'}
